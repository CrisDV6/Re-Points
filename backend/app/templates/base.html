<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Re-Points transforma el reciclaje en beneficios para la comunidad.">
    <title>{% block title %}Re-Points{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
    <script src="{{ url_for('static', path='/js/main.js') }}" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/" aria-label="Inicio de Re-Points">
            <span class="brand-mark" aria-hidden="true">R</span>
            <span>Re-Points</span>
        </a>
        <button class="menu-button" type="button" aria-expanded="false" aria-controls="main-navigation">Menú</button>
        <nav id="main-navigation" class="main-navigation" aria-label="Navegación principal">
            <span id="public-info-links" class="nav-actions">
                <a href="/#como-funciona">Cómo funciona</a>
                <a href="/#beneficios">Beneficios</a>
            </span>
            <span id="guest-actions" class="nav-actions">
                <a href="/iniciar-sesion">Iniciar sesión</a>
                <a class="button button-small" href="/registro">Crear cuenta</a>
            </span>
            <span id="user-actions" class="nav-actions" hidden>
                <a id="station-link" href="/estacion" hidden>Estación</a>
                <a id="owner-link" href="/panel-dueno" hidden>Panel</a>
                <a id="qr-link" href="/mi-qr" hidden>Mi QR</a>
                <a id="history-link" href="/mi-historial" hidden>Mis puntos</a>
                <span id="nav-user-name" class="user-name"></span>
                <button id="logout-button" class="text-button" type="button">Cerrar sesión</button>
            </span>
        </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-footer">
        <div>
            <strong>Re-Points</strong>
            <p>Proyecto integrador de Ingeniería en Software.</p>
        </div>
        <p>Reciclar también construye comunidad.</p>
    </footer>
</body>
</html>
